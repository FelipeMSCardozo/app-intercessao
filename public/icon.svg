<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D98C" />
      <stop offset="50%" stop-color="#E8C66A" />
      <stop offset="100%" stop-color="#B8963D" />
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C66A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E8C66A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#151619" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="url(#haloGrad)" />
  
  <!-- Stylized Christian Cross & Prayer Flame -->
  <g transform="translate(256, 256)" stroke="url(#goldGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cross vertical -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke-width="24" stroke="url(#goldGrad)" />
    <!-- Cross horizontal -->
    <line x1="-80" y1="-50" x2="80" y2="-50" stroke-width="24" stroke="url(#goldGrad)" />
    <!-- Center light spark -->
    <circle cx="0" cy="-50" r="10" fill="#F4D98C" stroke="none" />
    <!-- Prayer Rays / Halo subtle ring -->
    <circle cx="0" cy="-50" r="54" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
    <!-- Open Book / Altar at base -->
    <path d="M-60,110 Q-30,95 0,110 Q30,95 60,110 L50,140 Q25,128 0,140 Q-25,128 -50,140 Z" fill="url(#goldGrad)" opacity="0.85" stroke-width="2" />
  </g>
</svg>
